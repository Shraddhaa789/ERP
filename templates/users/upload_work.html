{% extends "base.html" %}

{% block content %}
<style>
    .camera-panel {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 18px;
        align-items: start;
    }

    .camera-box {
        position: relative;
        min-height: 320px;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(135deg, #dce7fb 0%, #eef4ff 50%, #c9d7f7 100%);
        border: 1px solid #d9e2f2;
    }

    video,
    canvas {
        width: 100%;
        height: 100%;
        min-height: 320px;
        object-fit: cover;
        display: block;
    }

    .status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        color: #506180;
        font-weight: 700;
    }

    .hidden {
        display: none;
    }

    @media (max-width: 980px) {
        .camera-panel {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="camera-panel">
    <div class="form-card">
        <span class="eyebrow">Work Upload</span>
        <h3>Capture Site Work</h3>
        <p>Capture a site image first, then enter work details and submit the complete update.</p>

        <div class="camera-box">
            <span class="status" id="status">Opening camera...</span>
            <video id="camera" autoplay class="hidden"></video>
            <canvas id="snapshot" class="hidden"></canvas>
        </div>

        <div class="page-actions" style="margin-top: 16px;">
            <button class="action-btn" type="button" onclick="capture()">Capture</button>
            <button class="secondary-btn hidden" type="button" id="retakeBtn" onclick="retake()">Retake</button>
            <button class="action-btn hidden" type="button" id="doneBtn" onclick="done()">Done</button>
        </div>
    </div>

    <div class="form-card">
        <span class="eyebrow">Details</span>
        <h3>Work Information</h3>
        <p>The form unlocks after an image is captured.</p>

        <form method="POST" id="form" class="hidden">
            <div class="single-field">
                <label for="work_location">Location</label>
                <input id="work_location" name="location" placeholder="Enter location">
            </div>
            <div class="single-field">
                <label for="work_material">Material Type</label>
                <input id="work_material" name="material" placeholder="Enter material type">
            </div>
            <div class="single-field">
                <label for="work_quantity">Quantity</label>
                <input id="work_quantity" name="quantity" placeholder="Enter quantity">
            </div>
            <div class="single-field">
                <label for="work_remarks">Remarks</label>
                <input id="work_remarks" name="remarks" placeholder="Enter remarks">
            </div>

            <input type="hidden" name="image_data" id="imageData">

            <div class="page-actions">
                <button class="action-btn" type="submit">Submit Work</button>
            </div>
        </form>
    </div>
</div>

<script>
let video = document.getElementById("camera");
let canvas = document.getElementById("snapshot");
let statusText = document.getElementById("status");
let context = canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
    video.classList.remove("hidden");
    statusText.classList.add("hidden");
})
.catch(err => {
    statusText.innerText = "Camera not accessible";
    console.error(err);
});

function capture() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0);

    canvas.classList.remove("hidden");
    video.classList.add("hidden");

    document.getElementById("retakeBtn").classList.remove("hidden");
    document.getElementById("doneBtn").classList.remove("hidden");
}

function retake() {
    canvas.classList.add("hidden");
    video.classList.remove("hidden");

    document.getElementById("retakeBtn").classList.add("hidden");
    document.getElementById("doneBtn").classList.add("hidden");
    document.getElementById("form").classList.add("hidden");
}

function done() {
    document.getElementById("form").classList.remove("hidden");
    document.getElementById("imageData").value = canvas.toDataURL("image/png");
}
</script>
{% endblock %}
