<!DOCTYPE html>
<html>
<head>
    <title>ERP Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #31456f, #4e6fb7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            width: 850px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .left {
            width: 50%;
            background: #273c75;
            color: white;
            padding: 50px 40px;
        }

        .left h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .left p {
            opacity: 0.9;
            line-height: 1.6;
        }

        .right {
            width: 50%;
            padding: 40px;
        }

        .right h2 {
            margin-bottom: 20px;
            color: #2f3640;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        select {
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #273c75;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        button:hover {
            background: #192a56;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1> Construction ERP</h1>
        <p>
            Manage materials, projects, billing, and workforce efficiently.
        </p>
        <p>
            Built for Admins, Ground Teams, and Individual Users.
        </p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <h2>Login to your account</h2>

        <form method="POST" action="/login">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>

            <!-- Optional role UI -->
            <select name="role">
                <option value="admin">Admin</option>
                <option value="ground">Ground Team</option>
                <option value="user">User</option>
            </select>

            <button type="submit">Login</button>
        </form>

        <div class="footer-text">
            ERP System © 2026
        </div>
    </div>

</div>

</body>
</html>
