{% extends "base.html" %}

{% block panel_actions %}
<a class="secondary-btn" href="/report-documents">New Doc</a>
{% endblock %}

{% block content %}
<style>
    .report-shell {
        display: grid;
        gap: 18px;
    }

    .report-intro {
        display: block;
    }

    .report-intro p {
        margin: 0;
        color: var(--muted);
        max-width: 720px;
        line-height: 1.5;
    }

    .stats-grid-report {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
    }

    .stat-card-report {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid #d8e3f8;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
        box-shadow: 0 8px 16px rgba(33, 49, 85, 0.03);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .stat-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
    }

    .stat-icon svg {
        width: 26px;
        height: 26px;
    }

    .stat-icon.records {
        background: linear-gradient(135deg, #dfe5ff 0%, #ccd7ff 100%);
        color: #4f46e5;
    }

    .stat-icon.value {
        background: linear-gradient(135deg, #dcfce7 0%, #c9f7d8 100%);
        color: #10b981;
    }

    .stat-icon.location {
        background: linear-gradient(135deg, #fff2c6 0%, #ffe8a3 100%);
        color: #f59e0b;
    }

    .stat-copy {
        display: grid;
        gap: 3px;
    }

    .stat-card-report .label {
        color: #60769f;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .stat-card-report .value {
        color: var(--primary-strong);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.04em;
    }

    .report-control-card {
        padding: 18px 22px;
        border: 1px solid #d8e3f8;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(244, 248, 254, 0.9) 50%, rgba(230, 240, 255, 0.9) 100%);
        background-size: 200% 200%;
        backdrop-filter: blur(16px);
        box-shadow: 0 16px 40px rgba(34, 56, 97, 0.05), inset 0 1px 0 #ffffff;
    }

    .report-control-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 18px;
        flex-wrap: wrap;
    }

    .report-control-row .field {
        min-width: 240px;
        max-width: 100%;
    }

    .report-filter-group {
        display: flex;
        gap: 16px;
        align-items: flex-end;
        flex-wrap: wrap;
        flex: 1 1 auto;
    }

    .report-control-row label {
        display: block;
        margin-bottom: 8px;
        color: #60769f;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .report-select {
        min-height: 50px;
        padding: 12px 18px;
        border-radius: 14px;
        border: 2px solid #b7cbff;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        color: #2b4f98;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 0 0 4px rgba(80, 121, 209, 0.08);
    }

    .download-btn {
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #23324f;
        background: #fff;
        color: #111827;
        font-weight: 700;
        box-shadow: none;
    }

    .year-filter-wrap {
        display: grid;
        gap: 10px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #e4ecfb;
    }

    .year-filter-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .year-filter-head span {
        color: #60769f;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .year-filter-note {
        color: var(--muted);
        font-size: 13px;
    }

    .year-filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .year-chip {
        padding: 10px 16px;
        border: 1px solid #d8e3f8;
        border-radius: 999px;
        background: #fff;
        color: #4a669c;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .year-chip:hover {
        border-color: #9bb6ef;
        transform: translateY(-1px);
    }

    .year-chip.active {
        background: linear-gradient(135deg, #31539d 0%, #4b77d2 100%);
        border-color: #31539d;
        color: #fff;
        box-shadow: 0 10px 18px rgba(49, 83, 157, 0.18);
    }

    .download-btn:hover {
        background: #f6f8ff;
    }

    .download-btn svg {
        width: 18px;
        height: 18px;
    }

    .report-status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    .report-status-text {
        color: var(--muted);
        font-size: 14px;
    }

    .report-pagination {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .page-chip {
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #d8e3f8;
        background: #fff;
        color: #35508c;
        font-weight: 700;
        cursor: pointer;
    }

    .page-chip:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .page-info {
        color: #4f6288;
        font-size: 13px;
        font-weight: 700;
    }

    .report-card {
        border: 1px solid #d8e3f8;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
        box-shadow: var(--shadow);
    }

    .report-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 16px 20px;
        border-bottom: 1px solid #e4ecfb;
        background: linear-gradient(180deg, #f7faff 0%, #eef4ff 100%);
    }

    .report-card-header h3 {
        margin: 0 0 4px;
        color: var(--primary);
        font-size: 20px;
    }

    .report-title-line {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .report-card-header p {
        margin: 0;
        color: var(--muted);
    }

    .report-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: #e7efff;
        color: #4766a4;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .table-wrap {
        overflow-x: auto;
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
        max-height: 650px;
        padding-bottom: 10px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }

    table {
        width: 100%;
        min-width: 2400px;
        border-collapse: collapse;
        background: #fff;
    }

    th,
    td {
        min-width: 105px;
        padding: 14px 12px;
        border-bottom: 1px solid #e8eef8;
        text-align: left;
        font-size: 13px;
        vertical-align: top;
    }

    .group-header {
        background: #16233e;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .column-header {
        position: sticky;
        top: 0;
        background: #f0f4fc;
        color: #1e3668;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
        z-index: 1;
        border-bottom: 2px solid #b7cbff;
        padding-top: 14px;
        padding-bottom: 14px;
    }

    td {
        color: #263652;
        line-height: 1.45;
        word-break: break-word;
    }

    tbody tr:nth-child(even) {
        background: #fafcff;
    }

    .empty-state {
        padding: 42px 24px;
        text-align: center;
        color: var(--muted);
    }

    @media (max-width: 860px) {
        .stats-grid-report {
            grid-template-columns: 1fr;
        }

        .stat-card-report {
            padding: 16px;
        }

        .stat-card-report .value {
            font-size: 24px;
        }

        .report-filter-group {
            width: 100%;
            gap: 12px;
        }

        .report-control-row .field {
            min-width: 0;
            width: 100%;
        }

        .report-select,
        .download-btn,
        .page-chip {
            width: 100%;
        }

        .report-status-row,
        .report-pagination {
            align-items: stretch;
            flex-direction: column;
            width: 100%;
        }

        .year-chip {
            flex: 1 1 96px;
        }
    }

    .btn-delete-report {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: #fee2e2;
        color: #ef4444;
        border: 1px solid #fecaca;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-delete-report:hover {
        background: #fecaca;
        color: #dc2626;
        transform: scale(1.1);
    }

    .report-action-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .btn-docs-report {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid #bfdbfe;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
    }

    .btn-docs-report:hover {
        background: #dbeafe;
    }

    .btn-docs-report.disabled {
        border-color: #e5e7eb;
        background: #f8fafc;
        color: #94a3b8;
        pointer-events: none;
    }

    .report-doc-message {
        margin-top: 10px;
        color: #4766a4;
        font-size: 13px;
        font-weight: 700;
    }
</style>

<div class="report-shell">
    <div class="report-intro">
    </div>

    <div class="stats-grid-report">
        <div class="stat-card-report">
            <div class="stat-icon records">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"></path>
                    <path d="M14 2v5h5"></path>
                    <path d="M9 13h6"></path>
                    <path d="M9 17h4"></path>
                </svg>
            </div>
            <div class="stat-copy">
                <span class="label">Total Records</span>
                <div class="value" id="report_total_records">0</div>
            </div>
        </div>

        <div class="stat-card-report">
            <div class="stat-icon value">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1v22"></path>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div class="stat-copy">
                <span class="label">Total Value</span>
                <div class="value" id="report_total_value">Rs. 0</div>
            </div>
        </div>

        <div class="stat-card-report">
            <div class="stat-icon location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <div class="stat-copy">
                <span class="label">Unique Locations</span>
                <div class="value" id="report_location_count">0</div>
            </div>
        </div>
        <div class="stat-card-report">
            <div class="stat-icon" style="background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%); color: #d97706;">&#x1F4B0;</div>
            <div class="stat-copy">
                <span class="label">mahaIT Cost</span>
                <div class="value" id="mahait_cost">0</div>
            </div>
        </div>
    </div>

    <div class="report-control-card">
        <div class="report-control-row">
            <div class="report-filter-group">
                <div class="field">
                    <label for="report_type">View Mode</label>
                    <select id="report_type" class="report-select" onchange="changeReportType()">
                        <option value="inward">INWARD ENTRIES</option>
                        <option value="outward">OUTWARD ENTRIES</option>
                    </select>
                </div>
                <div class="field">
                    <label for="report_year_select">Year Filter</label>
                    <select id="report_year_select" class="report-select" onchange="changeYear(this.value)">
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="field">
                    <label for="report_category">Category</label>
                    <select id="report_category" class="report-select" onchange="filterReportSubCategories()">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="field">
                    <label for="report_sub_category">Sub Category</label>
                    <select id="report_sub_category" class="report-select" onchange="filterReportMaterials()">
                        <option value="">All Sub-Categories</option>
                    </select>
                </div>
                <div class="field">
                    <label for="report_search_field">Search In Field</label>
                    <select id="report_search_field" class="report-select"
                        onchange="currentPage = 1; renderCurrentReport();"></select>
                </div>
                <div class="field">
                    <label for="report_search">Search Fields</label>
                    <input id="report_search" class="report-select" type="text" placeholder="Search any table value"
                        oninput="triggerReportSearch()">
                </div>
                <div class="field">
                    <label for="filter_type">Filter Type</label>
                    <select id="filter_type" class="report-select">
                        <option value="10%">10%</option>
                        <option value="60%">60%</option>
                        <option value="25%">25%</option>
                        <option value="5%">5%</option>
                    </select>
                </div>
            </div>
            <button class="action-btn download-btn" type="button" onclick="downloadReport()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M12 15V3"></path>
                </svg>
                <span>Download Excel</span>
            </button>
        </div>

        <div class="report-status-row">
            <div class="report-status-text" id="report_status_text">Loading report records...</div>
            <div class="report-pagination">
                <button type="button" class="page-chip" id="report_prev_btn" onclick="changePage(-1)">Previous</button>
                <div class="page-info" id="report_page_info">Page 1</div>
                <button type="button" class="page-chip" id="report_next_btn" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </div>

    <section class="report-card">
        <div class="report-card-header">
            <div>
                <div class="report-title-line">
                    <h3 id="report_title">Inward Report</h3>
                </div>
                <p id="report_subtitle">Showing all inward entries created in the system.</p>
            </div>
            <div class="report-badge" id="report_badge">Inward</div>
        </div>

        <div class="table-wrap">
            <table id="report_table">
                <thead id="report_head"></thead>
                <tbody id="report_body"></tbody>
            </table>
        </div>
    </section>
</div>

                { key: "out_grand_total", label: "Grand Total" },
                { key: "out_transport_name", label: "Transport Name" },
                { key: "out_vehicle_no", label: "Vehicle No" },
                { key: "out_pkgs_qty", label: "Pkgs Qty" },
                { key: "out_dispatched_date", label: "Dispatched Date" },
                { key: "out_mode_of_delivery", label: "Mode of Delivery" },
                { key: "out_reporting_time", label: "Reporting Time" },
                { key: "out_loading_time", label: "Loading Time" },
                { key: "out_remark", label: "Remark" },
                { key: "out_ug_aerial", label: "UG/Aerial" },
                { key: "out_frt", label: "FRT" },
                { key: "actions", label: "Action" }
            ]
        }
    };

    let currentReportRows = [];
    let filteredReportRows = [];
    let selectedReportYear = null;
    let currentPage = 1;
    let totalReportRows = 0;
    const reportPageSize = 100;
    let reportSearchDebounce = null;
    let materialCategories = {};
    let materialCategoriesByCode = {};

    function normalizeMaterialKey(value) {
        return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function getMaterialInfo(description, itemCode = "") {
        const codeMatch = itemCode ? materialCategoriesByCode[normalizeMaterialKey(itemCode)] : null;
        if (codeMatch) return codeMatch;

        const direct = materialCategories[description];
        if (direct) return direct;

        const target = normalizeMaterialKey(description);
        const match = Object.entries(materialCategories).find(([key]) => normalizeMaterialKey(key) === target);
        return match ? match[1] : { category: "Uncategorized", sub_category: "" };
    }

    function currentReportDescriptions() {
        return currentReportRows
            .map((row) => String(row.description || row.out_description || "").trim())
            .filter(Boolean);
    }

    function syncReportCategoryFilter(resetSelection = false) {
        const categorySelect = document.getElementById("report_category");
        if (!categorySelect) return;

        const currentValue = resetSelection ? "" : categorySelect.value;
        const categories = [...new Set(Object.values(materialCategories)
            .map((info) => info.category)
            .filter((category) => category && category !== "Uncategorized"))].sort();

        categorySelect.innerHTML = '<option value="">All Categories</option>' +
            categories.map(c => `<option value="${c}">${c}</option>`).join("");
        categorySelect.value = categories.includes(currentValue) ? currentValue : "";
        if (!categorySelect.value) {
            resetReportMaterialFilters();
        } else {
            filterReportSubCategories(false);
        }
    }

    async function fetchMaterialCategories() {
        try {
            const res = await fetch('/material-categories');
            materialCategories = await res.json();
            materialCategoriesByCode = {};
            Object.values(materialCategories).forEach((info) => {
                if (info.item_code) {
                    materialCategoriesByCode[normalizeMaterialKey(info.item_code)] = info;
                }
            });
            syncReportCategoryFilter(true);
        } catch (e) {
            console.error("Failed to load categories", e);
        }
    }

    function resetReportMaterialFilters() {
        const subCategorySelect = document.getElementById("report_sub_category");
        const materialSelect = document.getElementById("report_material");
        if (subCategorySelect) {
            subCategorySelect.innerHTML = '<option value="">All Sub-Categories</option>';
            const subCategoryField = subCategorySelect.closest(".field");
            if (subCategoryField) {
                subCategoryField.style.display = "";
            }
        }
        if (materialSelect) {
            materialSelect.innerHTML = '<option value="">All Materials</option>';
        }
    }

    function filterReportSubCategories(shouldRender = true) {
        const category = document.getElementById("report_category").value;
        const subCategorySelect = document.getElementById("report_sub_category");

        if (!category) {
            subCategorySelect.innerHTML = '<option value="">All Sub-Categories</option>';
            const subCategoryField = subCategorySelect.closest(".field");
            if (subCategoryField) {
                subCategoryField.style.display = "";
            }
            const materialSelect = document.getElementById("report_material");
            if (materialSelect) {
                materialSelect.innerHTML = '<option value="">All Materials</option>';
            }
        } else {
            const subCategories = [...new Set(Object.values(materialCategories)
                .filter(m => m.category === category)
                .map(m => m.sub_category)
                .filter(Boolean))].sort();
            const subCategoryField = subCategorySelect.closest(".field");
            if (subCategoryField) {
                subCategoryField.style.display = subCategories.length ? "" : "none";
            }
            subCategorySelect.innerHTML = '<option value="">All Sub-Categories</option>' +
                subCategories.map(sc => `<option value="${sc}">${sc}</option>`).join("");

            filterReportMaterials(false);
        }
        currentPage = 1;
        if (shouldRender) {
            loadReport();
        }
    }

    function filterReportMaterials(shouldRender = true) {
        const category = document.getElementById("report_category").value;
        const subCategory = document.getElementById("report_sub_category").value;
        const materialSelect = document.getElementById("report_material");

        const categorySubCategories = [...new Set(Object.values(materialCategories)
            .filter(m => m.category === category)
            .map(m => m.sub_category)
            .filter(Boolean))];
        const materials = Object.entries(materialCategories)
            .filter(([desc, m]) => (
                (!category || m.category === category) &&
                (!categorySubCategories.length || !subCategory || m.sub_category === subCategory)
            ))
            .map(([desc]) => desc)
            .sort();

        if (materialSelect) {
            materialSelect.innerHTML = '<option value="">All Materials</option>' + 
                materials.map(m => `<option value="${m}">${m}</option>`).join("");
        }
        currentPage = 1;
        if (shouldRender) {
            loadReport();
        }
    }

    function numberValue(value) {
        const parsed = parseFloat(value);
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function safeValue(value) {
        return value === null || value === undefined || value === "" ? "-" : value;
    }

    function changeReportType() {
        document.getElementById("report_search").value = "";
        document.getElementById("report_search_field").innerHTML = "";
        const categorySelect = document.getElementById("report_category");
        if (categorySelect) {
            categorySelect.value = "";
        }
        resetReportMaterialFilters();
        currentPage = 1;
        loadYearFilters();
    }

    function loadYearFilters() {
        const type = document.getElementById("report_type").value;

        fetch(`/report-years?type=${type}`)
            .then(async (res) => {
                if (!res.ok) {
                    throw new Error(`Year load failed with status ${res.status}`);
                }
                return res.json();
            })
            .then((years) => {
                const list = Array.isArray(years) ? years : [];
                selectedReportYear = "all";
                renderYearDropdown(list);
                loadReport();
            })
            .catch((error) => {
                console.error(error);
                selectedReportYear = "all";
                renderYearDropdown([]);
                loadReport();
            });
    }

    function changeYear(val) {
        selectedReportYear = val;
        currentPage = 1;
        const categorySelect = document.getElementById("report_category");
        if (categorySelect) {
            categorySelect.value = "";
        }
        resetReportMaterialFilters();
        loadReport();
    }

    function renderYearDropdown(years) {
        const select = document.getElementById("report_year_select");
        if (!select) return;
        select.innerHTML = `<option value="all">All</option>`;

        years.forEach((year) => {
            const opt = document.createElement("option");
            opt.value = year;
            opt.textContent = year;
            if (String(year) === selectedReportYear) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });
        select.value = selectedReportYear || "all";
    }

    function loadReport() {
        const type = document.getElementById("report_type").value;
        const config = reportConfigs[type];
        const searchTerm = document.getElementById("report_search").value.trim();
        const searchField = document.getElementById("report_search_field").value || "all";
        const category = document.getElementById("report_category").value || "";
        const subCategory = document.getElementById("report_sub_category").value || "";
        const material = document.getElementById("report_material")?.value || "";
        const offset = (currentPage - 1) * reportPageSize;

        document.getElementById("report_title").textContent = config.title;
        document.getElementById("report_subtitle").textContent = config.subtitle;
        document.getElementById("report_badge").textContent = config.badge;
        populateSearchFields(config);
        document.getElementById("report_status_text").textContent = "Loading report records...";

        const yearQuery = selectedReportYear && selectedReportYear !== "all" ? `&year=${selectedReportYear}` : "";
        const searchQuery = searchTerm ? `&search=${encodeURIComponent(searchTerm)}&field=${encodeURIComponent(searchField)}` : "";
        const categoryQuery = category ? `&category=${encodeURIComponent(category)}` : "";
        const subCategoryQuery = subCategory ? `&sub_category=${encodeURIComponent(subCategory)}` : "";
        const materialQuery = material ? `&material=${encodeURIComponent(material)}` : "";
        fetch(`/report-data?type=${type}${yearQuery}&limit=${reportPageSize}&offset=${offset}${searchQuery}${categoryQuery}${subCategoryQuery}${materialQuery}`)
            .then(async (res) => {
                if (!res.ok) {
                    if (res.status === 401) {
                        const data = await res.json();
                        if (data.redirect) {
                            window.location.href = data.redirect;
                            return;
                        }
                    }
                    throw new Error(`Load failed with status ${res.status}`);
                }
                return res.json();
            })
            .then((payload) => {
                currentReportRows = Array.isArray(payload.data) ? payload.data : [];
                totalReportRows = Number(payload.total_count || 0);
                renderCurrentReport();
            })
            .catch((error) => {
                console.error(error);
                currentReportRows = [];
                totalReportRows = 0;
                renderCurrentReport();
            });
    }

    function renderCurrentReport() {
        const type = document.getElementById("report_type").value;
        const config = reportConfigs[type];
        const searchTerm = document.getElementById("report_search").value.trim().toLowerCase();
        const fieldSelect = document.getElementById("report_search_field");
        const searchField = fieldSelect.value;

        filteredReportRows = currentReportRows.filter((row) => {
            if (!searchTerm) {
                return true;
            }

            if (searchField === "all") {
                return config.headers.some((header) => String(safeValue(row[header.key])).toLowerCase().includes(searchTerm));
            }

            return String(safeValue(row[searchField])).toLowerCase().includes(searchTerm);
        });

        renderReportTable(config, filteredReportRows);
        updateReportStats(config, filteredReportRows);
        updatePaginationState();
    }

    function triggerReportSearch() {
        clearTimeout(reportSearchDebounce);
        reportSearchDebounce = setTimeout(() => {
            currentPage = 1;
            loadReport();
        }, 300);
    }

    function changePage(direction) {
        const nextPage = currentPage + direction;
        const totalPages = Math.max(1, Math.ceil(totalReportRows / reportPageSize));

        if (nextPage < 1 || nextPage > totalPages) {
            return;
        }

        currentPage = nextPage;
        loadReport();
    }

    function updatePaginationState() {
        const totalPages = Math.max(1, Math.ceil(totalReportRows / reportPageSize));
        const startRow = totalReportRows ? ((currentPage - 1) * reportPageSize) + 1 : 0;
        const endRow = Math.min(currentPage * reportPageSize, totalReportRows);

        document.getElementById("report_prev_btn").disabled = currentPage <= 1;
        document.getElementById("report_next_btn").disabled = currentPage >= totalPages;
        document.getElementById("report_page_info").textContent = `Page ${currentPage} of ${totalPages}`;
        const hasClientFilters = Boolean(
            document.getElementById("report_category")?.value ||
            document.getElementById("report_sub_category")?.value ||
            document.getElementById("report_material")?.value
        );
        if (hasClientFilters && filteredReportRows.length !== currentReportRows.length) {
            document.getElementById("report_status_text").textContent = filteredReportRows.length
                ? `Showing ${filteredReportRows.length} filtered records from ${currentReportRows.length} loaded records`
                : `No visible rows for the selected category/material filter. Clear filters or choose All Categories.`;
        } else {
            document.getElementById("report_status_text").textContent = totalReportRows
                ? `Showing ${startRow}-${endRow} of ${totalReportRows} records`
                : "No records found for the selected filters.";
        }
    }

    function populateSearchFields(config) {
        const select = document.getElementById("report_search_field");
        const params = new URLSearchParams(window.location.search);
        const fieldParam = params.get("search_field") || params.get("field");
        let current = select.value || "all";
        if (fieldParam && current === "all") {
            current = fieldParam;
        }

        select.innerHTML = `<option value="all">All Fields</option>` +
            config.headers.map((header) => `<option value="${header.key}">${header.label}</option>`).join("");

        if ([...select.options].some((option) => option.value === current)) {
            select.value = current;
        } else {
            select.value = "all";
        }
    }

    function renderReportTable(config, rows) {
        const thead = document.getElementById("report_head");
        const tbody = document.getElementById("report_body");
        const reportType = document.getElementById("report_type").value;

        const groupRow = `<tr>${config.groups.map((group) => `<th class="group-header" colspan="${group.count}">${group.name}</th>`).join("")}</tr>`;
        const headerRow = `<tr>${config.headers.map((header) => `<th class="column-header">${header.label}</th>`).join("")}</tr>`;
        thead.innerHTML = groupRow + headerRow;
        tbody.innerHTML = "";

        if (!rows.length) {
            tbody.innerHTML = `<tr><td colspan="${config.headers.length}" class="empty-state">No ${config.badge.toLowerCase()} records found.</td></tr>`;
            return;
        }

        const fragment = document.createDocumentFragment();

        rows.forEach((row) => {
            const tr = document.createElement("tr");
            config.headers.forEach((header) => {
                const td = document.createElement("td");
                if (header.key === "actions") {
                    td.className = "report-action-cell";
                    const hasDoc = numberValue(row.doc_count) > 0 && row.doc_url;
                    const docLabel = numberValue(row.doc_count) > 1 ? `View Doc (${row.doc_count})` : "View Doc";
                    const docButton = hasDoc
                        ? `<a href="${row.doc_url}" target="_blank" class="btn-docs-report">${docLabel}</a>`
                        : `<span class="btn-docs-report disabled">No Doc</span>`;
                    td.innerHTML = `
                        ${docButton}
                        <form action="/delete-report-entry" method="POST" onsubmit="return confirm('Delete this record?');">
                            <input type="hidden" name="id" value="${row.id}">
                            <input type="hidden" name="type" value="${reportType}">
                            <button type="submit" class="btn-delete-report" title="Delete Entry">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </form>
                    `;
                } else {
                    td.textContent = safeValue(row[header.key]);
                }
                tr.appendChild(td);
            });
            fragment.appendChild(tr);
        });

        tbody.appendChild(fragment);
    }

    function showReportDocMessage() {
        const params = new URLSearchParams(window.location.search);
        const status = params.get("doc_status");
        const type = params.get("type");
        const searchVal = params.get("search") || params.get("q");

        if (type && document.getElementById("report_type")) {
            document.getElementById("report_type").value = type;
            const docTypeEl = document.getElementById("report_doc_type");
            if (docTypeEl) docTypeEl.value = type;
        }

        if (searchVal && document.getElementById("report_search")) {
            document.getElementById("report_search").value = searchVal;
        }

        if (!status) return;

        const messages = {
            matched: `Document scanned and assigned to ${params.get("matched_count") || 1} matching report entry.`,
            no_match: `Document scanned (${params.get("scan_chars") || 0} characters read), but no matching report entry was found.`,
            missing: "Please choose a document to upload.",
            too_large: "Document is too large. Please upload a file below 10MB."
        };
        document.getElementById("report_status_text").textContent = messages[status] || "";
    }

    function updateReportStats(config, rows) {
        const totalValue = rows.reduce((sum, row) => sum + numberValue(row[config.totalKey]), 0);
        const locations = new Set(rows.map((row) => row[config.locationKey]).filter(Boolean));

        document.getElementById("report_total_records").textContent = totalReportRows;
        document.getElementById("report_total_value").textContent = `Rs. ${totalValue.toLocaleString("en-IN", { maximumFractionDigits: 2 })}`;
        document.getElementById("report_location_count").textContent = locations.size;
    }

    function downloadReport() {
        const type = document.getElementById("report_type").value;
        const config = reportConfigs[type];
        const searchTerm_dl = document.getElementById("report_search").value.trim();
        const searchField_dl = document.getElementById("report_search_field").value || "all";
        const category_dl = document.getElementById("report_category").value || "";
        const subCategory_dl = document.getElementById("report_sub_category").value || "";
        const material_dl = document.getElementById("report_material") ? document.getElementById("report_material").value : "";
        var yearQ = selectedReportYear && selectedReportYear !== "all" ? "&year=" + selectedReportYear : "";
        var searchQ = searchTerm_dl ? "&search=" + encodeURIComponent(searchTerm_dl) + "&field=" + encodeURIComponent(searchField_dl) : "";
        var catQ = category_dl ? "&category=" + encodeURIComponent(category_dl) : "";
        var subCatQ = subCategory_dl ? "&sub_category=" + encodeURIComponent(subCategory_dl) : "";
        var matQ = material_dl ? "&material=" + encodeURIComponent(material_dl) : "";
        var btn = document.querySelector(".download-btn");
        if (btn) { btn.disabled = true; btn.querySelector("span").textContent = "Preparing Download..."; }
        fetch("/report-data-export?type=" + type + yearQ + searchQ + catQ + subCatQ + matQ)
            .then(function(res) { if (!res.ok) throw new Error("Export failed"); return res.json(); })
            .then(function(payload) {
                var allRows = Array.isArray(payload.data) ? payload.data : [];
                var csvLines = [];
                var exportHeaders = config.headers.filter(function(h) { return h.key !== "actions"; });
                csvLines.push(exportHeaders.map(function(h) { return '"' + h.label.replace(/"/g, '""') + '"'; }).join(","));
                allRows.forEach(function(row) {
                    csvLines.push(exportHeaders.map(function(h) { return '"' + String(safeValue(row[h.key])).replace(/"/g, '""') + '"'; }).join(","));
                });
                var blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
                var dlUrl = URL.createObjectURL(blob);
                var link = document.createElement("a");
                var stamp = new Date().toISOString().split("T")[0];
                link.href = dlUrl;
                link.download = config.badge + "_Report_" + stamp + ".csv";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(dlUrl);
            })
            .catch(function(err) { console.error("Download error:", err); alert("Failed to download report. Please try again."); })
            .then(function() { if (btn) { btn.disabled = false; btn.querySelector("span").textContent = "Download Excel"; } });
    }

    showReportDocMessage();
    fetchMaterialCategories();
    loadYearFilters();
</script>
{% endblock %}
