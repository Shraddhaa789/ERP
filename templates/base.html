<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ panel_title or "ERP Dashboard" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --nav-height: 78px;
            --primary: #223861;
            --primary-light: #4A6491;
            --primary-strong: #12203A;
            --accent: #64A0F8;
            --accent-soft: #F0F6FF;
            --surface: #ffffff;
            --surface-soft: #f7f9fe;
            --surface-muted: #eef3fb;
            --background: #F4F8FE;
            --border: #D7E2F0;
            --text: #12243E;
            --muted: #6A7D9D;
            --success: #13865E;
            --warning: #B16E1E;
            --danger: #B91C1C;
            --shadow: 0 18px 42px rgba(18, 32, 58, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-width: 0;
            overflow-x: hidden;
            font-family: "Inter", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(100, 160, 248, 0.13), transparent 24%),
                linear-gradient(180deg, #EFF4FC 0%, var(--background) 48%, #F7F9FE 100%);
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        a,
        button,
        input,
        select,
        textarea {
            max-width: 100%;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(214, 224, 241, 0.95);
            box-shadow: 0 10px 28px rgba(18, 32, 58, 0.07);
            z-index: 1000;
        }

        .brand {
            color: var(--primary);
            text-decoration: none;
            font-size: 28px;
            font-family: "Space Grotesk", "Inter", Arial, sans-serif;
            font-weight: 800;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .brand span {
            color: var(--primary-strong);
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }

        .nav-link {
            padding: 10px 14px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            border-radius: 999px;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
            background: var(--accent-soft);
            transform: translateY(-1px);
        }

        .nav-group {
            position: relative;
            padding-bottom: 14px;
            margin-bottom: -14px;
        }

        .nav-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            cursor: pointer;
            user-select: none;
        }

        .nav-toggle::-webkit-details-marker {
            display: none;
        }

        .nav-caret {
            font-size: 11px;
            line-height: 1;
            transition: transform 0.18s ease;
        }

        .nav-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 190px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 36px rgba(37, 52, 85, 0.14);
            display: none;
            z-index: 1100;
        }

        .nav-group[open] .nav-dropdown {
            display: grid;
            gap: 6px;
        }

        .nav-group[open] .nav-caret {
            transform: rotate(180deg);
        }

        .nav-dropdown .nav-link {
            display: block;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
        }

        .nav-logout {
            color: #fff;
            background: linear-gradient(135deg, var(--primary-strong) 0%, var(--primary) 58%, var(--primary-light) 100%);
            box-shadow: 0 12px 24px rgba(34, 56, 97, 0.18);
        }

        .nav-logout:hover {
            color: #fff;
            background: linear-gradient(135deg, #0F1B32 0%, var(--primary) 100%);
        }

        .page {
            padding: calc(var(--nav-height) + 28px) 32px 32px;
            width: 100%;
            min-width: 0;
        }

        .welcome-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .welcome-box strong {
            display: block;
            font-size: 18px;
            color: var(--primary-strong);
            margin-bottom: 4px;
        }

        .muted {
            color: var(--muted);
        }

        .small-btn,
        .action-btn,
        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            border-radius: 14px;
            font-weight: 700;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .action-btn,
        .small-btn {
            color: #fff;
            background: linear-gradient(135deg, var(--primary-strong) 0%, var(--primary) 58%, var(--primary-light) 100%);
            border: none;
            box-shadow: 0 12px 24px rgba(34, 56, 97, 0.18);
        }

        .action-btn:hover,
        .small-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn {
            padding: 11px 18px;
            font-size: 14px;
        }

        .small-btn {
            padding: 8px 12px;
            font-size: 12px;
        }

        .secondary-btn {
            padding: 11px 18px;
            color: var(--primary);
            background: var(--accent-soft);
            border: 1px solid var(--border);
        }

        .panel {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            min-width: 0;
            animation: portalCardEnter 520ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            background: linear-gradient(180deg, #F7F9FE 0%, #EEF4FF 100%);
            border-bottom: 1px solid var(--border);
        }

        .panel-title-text {
            font-size: 24px;
            font-family: "Space Grotesk", "Inter", Arial, sans-serif;
            font-weight: 800;
            color: var(--primary);
        }

        .panel-title-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .panel-body {
            padding: 24px;
            min-height: 460px;
            min-width: 0;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 240px minmax(420px, 1fr);
            gap: 28px;
            align-items: start;
        }

        .photo-card,
        .tile,
        .form-card,
        .list-card,
        .details-card,
        .records-card,
        .feature-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .photo-card:hover,
        .tile:hover,
        .form-card:hover,
        .list-card:hover,
        .details-card:hover,
        .records-card:hover,
        .feature-card:hover {
            transform: translateY(-2px);
            border-color: rgba(100, 160, 248, 0.46);
            box-shadow: 0 22px 46px rgba(18, 32, 58, 0.1);
        }

        .photo-card,
        .tile,
        .form-card,
        .list-card,
        .feature-card {
            padding: 22px;
        }

        .photo-card {
            text-align: center;
        }

        .photo-box {
            width: 186px;
            height: 214px;
            margin: 0 auto 12px;
            border-radius: 18px;
            border: 1px solid #dce5f6;
            background:
                linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.16)),
                linear-gradient(135deg, #c6def7, #ddeafe 36%, #b69472 37%, #a98563 68%, #7f6757 100%);
            position: relative;
            overflow: hidden;
        }

        .photo-box::after {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px solid rgba(255, 255, 255, 0.42);
            border-radius: 10px;
        }

        .details-card {
            overflow: hidden;
        }

        .details-header {
            padding: 20px 22px 16px;
            background: linear-gradient(135deg, var(--primary-strong) 0%, var(--primary) 58%, var(--primary-light) 100%);
            color: #fff;
        }

        .details-header h2 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: -0.03em;
        }

        .designation {
            margin: 0;
            color: #D9E8FF;
            font-family: "Space Grotesk", "Inter", Arial, sans-serif;
            font-weight: 800;
        }

        .designation span {
            color: #fff;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 58px;
            border-top: 1px solid #e5ecf8;
        }

        .detail-label,
        .detail-value {
            padding: 14px 22px;
            font-size: 15px;
        }

        .detail-label {
            color: var(--muted);
        }

        .detail-value {
            font-weight: 700;
            color: var(--primary-strong);
        }

        .simple-grid,
        .stats-grid,
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .stats-grid .tile {
            position: relative;
            overflow: hidden;
        }

        .stats-grid .tile::before {
            content: "";
            position: absolute;
            inset: auto -30px -30px auto;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(80, 121, 209, 0.14), transparent 70%);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 700;
            color: var(--primary-strong);
            letter-spacing: -0.04em;
        }

        .tile h3,
        .form-card h3,
        .list-card h3,
        .feature-card h3 {
            margin: 0 0 12px;
            color: var(--primary);
            font-family: "Space Grotesk", "Inter", Arial, sans-serif;
            font-size: 20px;
        }

        .tile p,
        .feature-card p,
        .list-card p,
        .form-card p {
            color: var(--muted);
            line-height: 1.6;
        }

        .feature-list,
        .info-list {
            display: grid;
            gap: 12px;
            margin: 0;
        }

        .info-row,
        .feature-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 13px 14px;
            background: #fff;
            border: 1px solid #e4ebf7;
            border-radius: 14px;
        }

        .feature-row strong,
        .info-row strong {
            color: var(--primary-strong);
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .field-row label,
        .single-field label {
            display: block;
            margin-bottom: 8px;
            color: #556784;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .single-field {
            margin-bottom: 16px;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
            border: 1px solid #d1dbed;
            border-radius: 14px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(100, 160, 248, 0.16);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 14px 16px;
            background: #fff;
            border: 1px solid #e2eaf7;
            border-radius: 14px;
            color: var(--muted);
        }

        .records-card {
            overflow: hidden;
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            border-bottom: 1px solid #e4ebf7;
            background: linear-gradient(180deg, #F9FBFF 0%, #EEF4FF 100%);
        }

        .records-header h3 {
            margin: 0 0 4px;
            color: var(--primary);
        }

        .records-header p {
            margin: 0;
            color: var(--muted);
        }

        .table-wrap {
            overflow-x: auto;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            padding: 13px 14px;
            text-align: left;
            border-bottom: 1px solid #e8eef8;
            font-size: 13px;
            vertical-align: top;
        }

        th {
            color: var(--primary);
            background: #edf3ff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 11px;
        }

        tbody tr:nth-child(even) {
            background: #fafcff;
        }

        .page-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            color: var(--primary);
            background: var(--accent-soft);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        @keyframes portalCardEnter {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 1ms !important;
            }
        }

        @media (max-width: 980px) {
            .navbar {
                position: sticky;
                height: auto;
                align-items: stretch;
                flex-direction: column;
                padding: 14px 16px;
            }

            .brand {
                font-size: 24px;
            }

            .nav-links {
                flex-wrap: nowrap;
                justify-content: flex-start;
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
                scrollbar-width: thin;
            }

            .nav-link {
                white-space: nowrap;
            }

            .nav-group {
                flex: 0 0 auto;
            }

            .page {
                padding: 16px;
            }

            .nav-dropdown {
                position: fixed;
                left: 12px;
                right: 12px;
                top: auto;
                min-width: 0;
                max-width: calc(100vw - 24px);
            }

            .welcome-box {
                align-items: flex-start;
                flex-direction: column;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .detail-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            :root {
                --shadow: 0 10px 24px rgba(39, 56, 92, 0.07);
            }

            .page {
                padding: 12px;
            }

            .panel {
                border-radius: 16px;
            }

            .panel-title {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 16px;
            }

            .panel-title-text {
                font-size: 20px;
            }

            .panel-title-actions {
                width: 100%;
                margin-left: 0;
                flex-wrap: wrap;
            }

            .panel-body {
                padding: 14px;
                min-height: auto;
            }

            .welcome-box,
            .records-header,
            .info-row,
            .feature-row {
                border-radius: 14px;
            }

            .simple-grid,
            .stats-grid,
            .feature-grid,
            .field-row {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 28px;
            }

            .details-header h2 {
                font-size: 24px;
            }

            .action-btn,
            .secondary-btn,
            .small-btn {
                width: 100%;
            }

            .page-actions {
                width: 100%;
            }

            th,
            td {
                padding: 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 420px) {
            .page {
                padding: 8px;
            }

            .panel-body {
                padding: 10px;
            }

            input,
            select,
            textarea {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
    {% if app_settings and app_settings.get('compact_tables') %}
    <style>
        th, td { padding: 8px 10px !important; font-size: 12px !important; }
        .action-btn, .small-btn, .secondary-btn { padding: 6px 12px !important; font-size: 11px !important; }
        .status-pill, .status-badge { padding: 4px 10px !important; font-size: 11px !important; }
        .records-header { padding: 12px 16px !important; }
        .panel-body { padding: 16px !important; }
    </style>
    {% endif %}
<body>
    {% include "partials/navbar.html" %}

    <main class="page">
        {% if not frameless_page %}
        <section class="panel">
            <div class="panel-title">
                <div class="panel-title-text">{{ panel_title }}</div>
                <div class="panel-title-actions">{% block panel_actions %}{% endblock %}</div>
            </div>
            <div class="panel-body">
        {% endif %}

        {% block content %}{% endblock %}

        {% if not frameless_page %}
            </div>
        </section>
        {% endif %}
    </main>
</body>
</html>
